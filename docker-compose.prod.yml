services:

  # ==========================================
  # MySQL
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: couplead-prod-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - prod-mysql-data:/var/lib/mysql

    networks:
      - couplead-prod-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:8
    container_name: couplead-prod-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - prod-redis-data:/data

    networks:
      - couplead-prod-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # Kafka - KRaft
  # ==========================================
  kafka:
    image: apache/kafka:4.0.0
    container_name: couplead-prod-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        PLAINTEXT://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - prod-kafka-data:/var/lib/kafka/data

    networks:
      - couplead-prod-network


  # ==========================================
  # Elasticsearch
  # ==========================================
  elasticsearch:
    build:
      context: .
      dockerfile: docker/elasticsearch/Dockerfile

    container_name: couplead-prod-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node

      xpack.security.enabled: "false"

      ES_JAVA_OPTS: >
        -Xms512m
        -Xmx512m

    volumes:
      - prod-elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - couplead-prod-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20


  # ==========================================
  # Spring Boot
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: couplead-prod-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json

      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      ELASTICSEARCH_URI: http://elasticsearch:9200

      JWT_SECRET: ${JWT_SECRET}

      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}

      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}

      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE}
      AUTH_COOKIE_MAX_AGE_DAYS: ${AUTH_COOKIE_MAX_AGE_DAYS}

    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ./uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      elasticsearch:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - couplead-prod-network


  # ==========================================
  # LiveKit
  # ==========================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: couplead-prod-livekit
    restart: unless-stopped

    command:
      - --config
      - /etc/livekit.yaml

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    volumes:
      - ./docker/livekit/livekit.prod.yaml:/etc/livekit.yaml:ro

    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

    networks:
      - couplead-prod-network


  # ==========================================
  # Caddy
  # ==========================================
  caddy:
    image: caddy:2
    container_name: couplead-prod-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - prod-caddy-data:/data
      - prod-caddy-config:/config

    depends_on:
      - backend
      - livekit

    networks:
      - couplead-prod-network

  prometheus:
    image: prom/prometheus:latest
    container_name: couplead-prod-prometheus
    restart: unless-stopped

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prod-prometheus-data:/prometheus

    networks:
      - couplead-prod-network

  grafana:
    image: grafana/grafana:latest
    container_name: couplead-prod-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - prod-grafana-data:/var/lib/grafana

    networks:
      - couplead-prod-network

    depends_on:
      - prometheus

networks:
  couplead-prod-network:
    name: couplead-prod-network


volumes:
  prod-mysql-data:
  prod-redis-data:
  prod-kafka-data:
  prod-elasticsearch-data:
  prod-caddy-data:
  prod-caddy-config:
  prod-prometheus-data:
  prod-grafana-data: