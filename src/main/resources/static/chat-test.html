<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Couple Chat Test</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        #chat {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-top: 20px;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 8px 16px;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <h2>Couple Chat Test</h2>

    <button onclick="connect()">Connect</button>
    <button onclick="subscribeChat()">Subscribe</button>

    <br><br>

    <input id="message" placeholder="메시지를 입력하세요" oninput="typing()">
    <button onclick="sendMessage()">Send</button>
    <button onclick="markRead()">Read</button>
    <div id="typing"></div>
    <button onclick="sendTyping()">Typing 테스트</button>

    <div id="chat"></div>

    <script>

        let stompClient = null;

        function connect() {

            const socket = new SockJS('/ws');

            stompClient = Stomp.over(socket);

            stompClient.connect(
                {
                    Authorization: 'Bearer ' + localStorage.getItem('accessToken')
                },
                function (frame) {

                    log('Connected');

                },
                function (error) {

                    log('Connection failed');

                }
            );
        }

        function subscribeChat() {

            stompClient.subscribe('/topic/chat/1', function (message) {

                log('CHAT: ' + message.body);

            });

            stompClient.subscribe('/topic/chat/read/1', function (message) {

                log('READ: ' + message.body);

            });

            stompClient.subscribe('/topic/chat/typing/1', function (message) {

                console.log('Typing received:', message.body);

                const event = JSON.parse(message.body);

                if (event.typing) {

                    document.getElementById('typing').innerText =
                        event.nickname + ' 입력 중...';

                    clearTimeout(window.typingTimer);

                    window.typingTimer =
                        setTimeout(() => {

                            document.getElementById('typing').innerText = '';

                        }, 3000);
                }
            });

            stompClient.subscribe('/topic/presence/1', function (message) {

                console.log(

                    JSON.parse(message.body)

                );
            });

            log('Subscribed');
        }

        function sendMessage() {

            if (!stompClient || !stompClient.connected) {
                log('먼저 Connect 하세요.');
                return;
            }

            const content =
                document.getElementById('message').value;

            stompClient.send(
                '/pub/chat/send',
                {},
                JSON.stringify({
                    coupleId: 1,
                    content: content
                })
            );

            document.getElementById('message').value = '';
            document.getElementById('typing').innerText = '';
        }

        async function markRead() {
            await fetch('/api/chat/1/read', {
                method: 'POST',
                headers: {
                    'Authorization':
                        'Bearer ' + localStorage.getItem('accessToken')
                }
            });
        }

        function typing() {

            if (!stompClient || !stompClient.connected) {
                return;
            }

            stompClient.send(
                '/pub/chat/typing',
                {},
                JSON.stringify({
                    coupleId: 1
                })
            );
        }

        function log(text) {

            const chat =
                document.getElementById('chat');

            chat.innerHTML += '<div>' + text + '</div>';

            chat.scrollTop = chat.scrollHeight;
        }

        function sendTyping() {
            if (!stompClient || !stompClient.connected) {
                console.log('WebSocket이 연결되어 있지 않습니다.');
                return;
            }

            stompClient.publish({
                destination: '/pub/chat/typing',
                body: JSON.stringify({
                    coupleId: 1
                })
            });

            console.log('Typing 이벤트 전송');
        }

    </script>

</body>

</html>
