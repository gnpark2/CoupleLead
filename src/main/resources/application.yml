spring:

  application:
    name: couplead

  datasource:

    url: jdbc:mysql://localhost:3306/couplead

    username: root

    password: root

  jpa:

    hibernate:

      ddl-auto: update

    properties:

      hibernate:

        format_sql: true

    open-in-view: false

  data:

    redis:

      host: localhost

      port: 6379

  kafka:

    bootstrap-servers: localhost:9092

  elasticsearch:

    uris: http://localhost:9200

logging:

  level:

    org.hibernate.SQL: debug

    org.hibernate.orm.jdbc.bind: trace