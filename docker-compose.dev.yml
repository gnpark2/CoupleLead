services:

  # ==========================================
  # MySQL
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: couplead-dev-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - couplead-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:8
    container_name: couplead-dev-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis-data:/data

    networks:
      - couplead-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # Kafka - KRaft
  # ==========================================
  kafka:
    image: apache/kafka:4.0.0
    container_name: couplead-dev-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        PLAINTEXT://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - couplead-network


  # ==========================================
  # Elasticsearch
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    container_name: couplead-dev-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node

      xpack.security.enabled: "false"

      ES_JAVA_OPTS: >
        -Xms512m
        -Xmx512m

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - couplead-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20


  # ==========================================
  # Spring Boot
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: couplead-dev-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: dev

      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      ELASTICSEARCH_URI: http://elasticsearch:9200

      JWT_SECRET: ${JWT_SECRET}

      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      elasticsearch:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - couplead-network


  # ==========================================
  # LiveKit
  # ==========================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: couplead-dev-livekit

    restart: unless-stopped

    command:
      - --config
      - /etc/livekit.yaml

    volumes:
      - ./docker/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro

    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

    networks:
      - couplead-network


networks:
  couplead-network:
    name: couplead-dev-network


volumes:
  mysql-data:
  redis-data:
  elasticsearch-data: